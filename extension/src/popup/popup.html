<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Bulk Chat Manager</title>
    <link rel="stylesheet" href="../shared/tokens.css">
    <link rel="stylesheet" href="../shared/components.css">
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup" id="app">
      <header class="top">
        <img class="top-logo" src="../../icons/icon-48.png" alt="" width="32" height="32">
        <div class="top-text">
          <h1 data-i18n="popup.title">AI Bulk Chat Manager</h1>
          <div class="top-version tnum" id="version"></div>
        </div>
        <button class="btn btn-quiet btn-icon" id="open-options" type="button" data-i18n-attr="aria-label:popup.settings;title:popup.settings"></button>
      </header>

      <section class="status" id="status" role="status" aria-live="polite">
        <span class="status-icon" id="status-icon"></span>
        <div class="status-text">
          <div class="status-title" id="status-title"></div>
          <div class="status-sub" id="status-sub"></div>
        </div>
      </section>

      <section id="supported" hidden>
        <button class="btn btn-primary btn-block btn-lg" id="start" type="button"></button>
        <p class="shortcut" id="shortcut" hidden></p>
      </section>

      <section id="unsupported" hidden>
        <p class="lead" data-i18n="popup.openSupported"></p>
        <div class="site-grid" id="site-grid"></div>
      </section>

      <section class="prefs" data-i18n-attr="aria-label:popup.prefs">
        <div class="setting">
          <div class="setting-text">
            <div class="setting-title" id="l-fast" data-i18n="settings.fastMode"></div>
            <div class="setting-hint" data-i18n="settings.fastModeHint"></div>
          </div>
          <button class="switch" id="sw-fast" type="button" role="switch" aria-checked="true" aria-labelledby="l-fast"></button>
        </div>
        <div class="setting">
          <div class="setting-text">
            <div class="setting-title" id="l-auto" data-i18n="settings.autoLoad"></div>
            <div class="setting-hint" data-i18n="settings.autoLoadHint"></div>
          </div>
          <button class="switch" id="sw-auto" type="button" role="switch" aria-checked="true" aria-labelledby="l-auto"></button>
        </div>
      </section>

      <div id="nudge-mount"></div>

    </main>

    <!-- Rotating footer: About / GitHub / Rate / Support. Same behaviour and look as version 8. -->
    <footer class="footer-dock" id="footer-dock">
      <div class="footer-message-row">
        <div class="footer-message" id="footer-message"></div>
        <button class="footer-cta" id="footer-cta" type="button"></button>
      </div>
      <div class="footer-nav-wrap">
        <div class="footer-nav" id="footer-nav"></div>
        <div class="footer-indicator-track"><div class="footer-indicator" id="footer-indicator"><span class="footer-indicator-progress" id="footer-indicator-progress"></span></div></div>
      </div>
    </footer>

    <script src="../shared/namespace.js"></script>
    <script src="../shared/ext.js"></script>
    <script src="../shared/sites.js"></script>
    <script src="../shared/links.js"></script>
    <script src="../shared/settings.js"></script>
    <script src="../shared/i18n.js"></script>
    <script src="../shared/icons.js"></script>
    <script src="../shared/nudge.js"></script>
    <script src="../shared/inject.js"></script>
    <script src="../shared/page.js"></script>
    <script src="footer.js"></script>
    <script src="popup.js"></script>
  </body>
</html>

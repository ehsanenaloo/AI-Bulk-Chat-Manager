name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Validate manifest, files, syntax and locales
        run: node scripts/validate.mjs

  firefox:
    name: Firefox package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build the Firefox package
        run: node scripts/build-firefox.mjs

      - name: Lint the Firefox package
        # web-ext is Mozilla's linter for add-ons. It is run on demand and is not a dependency of the project.
        run: npx --yes web-ext@10.7.0 lint --source-dir dist/firefox
